<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical AI Assistant</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #343541;
            color: white;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 70%;
            padding: 15px;
            border-radius: 8px;
            line-height: 1.5;
            direction: rtl;
        }
        .user-message {
            align-self: flex-start;
            background-color: #10a37f;
        }
        .ai-message {
            align-self: flex-end;
            background-color: #444654;
        }
        #input-container {
            padding: 20px;
            background-color: #343541;
            border-top: 1px solid #565869;
            display: flex;
            gap: 10px;
            justify-content: center;
            direction: rtl;
        }
        input[type="text"] {
            width: 60%;
            padding: 15px;
            border-radius: 8px;
            border: none;
            background-color: #40414f;
            color: white;
            font-size: 16px;
            outline: none;
        }
        button {
            padding: 15px 20px;
            border-radius: 8px;
            border: none;
            background-color: #10a37f;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #0b8c6d;
        }
        .loading {
            align-self: flex-end;
            font-style: italic;
            color: #ccc;
        }
    </style>
</head>
<body>

    <div id="chat-container">
        <div class="message ai-message">مرحباً! أنا مساعدك الطبي الذكي. كيف يمكنني مساعدتك اليوم؟</div>
    </div>

    <div id="input-container">
        <input type="text" id="user-input" placeholder="اكتب سؤالك الطبي هنا..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">إرسال</button>
    </div>

    <script>
        async function sendMessage() {
            const inputField = document.getElementById("user-input");
            const message = inputField.value.trim();
            if (!message) return;

            const chatContainer = document.getElementById("chat-container");

            const userDiv = document.createElement("div");
            userDiv.className = "message user-message";
            userDiv.textContent = message;
            chatContainer.appendChild(userDiv);

            inputField.value = "";

            const loadingDiv = document.createElement("div");
            loadingDiv.className = "loading";
            loadingDiv.textContent = "يتم التفكير...";
            chatContainer.appendChild(loadingDiv);
            
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch("/api/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ question: message, max_tokens: 150 })
                });

                const data = await response.json();

                chatContainer.removeChild(loadingDiv);

                const aiDiv = document.createElement("div");
                aiDiv.className = "message ai-message";
                aiDiv.textContent = data.answer;
                chatContainer.appendChild(aiDiv);

            } catch (error) {
                chatContainer.removeChild(loadingDiv);
                const errorDiv = document.createElement("div");
                errorDiv.className = "message ai-message";
                errorDiv.style.color = "red";
                errorDiv.textContent = "حدث خطأ في الاتصال بالسيرفر.";
                chatContainer.appendChild(errorDiv);
            }

            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        }
    </script>
</body>
</html>
